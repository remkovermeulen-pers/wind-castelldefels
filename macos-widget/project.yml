# XcodeGen spec — generates CastelldefelsWind.xcodeproj.
#   brew install xcodegen        (one-time)
#   cd macos-widget && xcodegen generate
# then open CastelldefelsWind.xcodeproj in Xcode.
name: CastelldefelsWind
options:
  bundleIdPrefix: com.castelldefelswind
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # Leave the team empty; pick yours in Xcode → Signing & Capabilities.
    DEVELOPMENT_TEAM: ""

targets:
  CastelldefelsWind:
    type: application
    platform: macOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.castelldefelswind.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Castelldefels Wind
        INFOPLIST_KEY_LSUIElement: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
    dependencies:
      - target: WindWidgetExtension

  WindWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.castelldefelswind.app.WindWidget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widget/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Widget/Widget.entitlements
